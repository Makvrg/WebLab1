<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма студента</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
</head>
<body>
    <div class="container">
        <header>
            <h1 id="form-title">Добавление студента</h1>
            <a href="index.html" class="btn">Назад к списку</a>
        </header>

        <form id="student-form" class="card">

            <div class="form-group">
                <label for="fio">ФИО студента *</label>
                <input type="text" id="fio" required minlength="5" placeholder="Иванов Иван Иванович">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="group">Группа *</label>
                    <input type="text" id="group" required placeholder="Например: P3224">
                </div>
                <div class="form-group">
                    <label for="isu">ИСУ *</label>
                    <input type="number" id="isu" required min="100000" max="999999" placeholder="123456">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="dorm">Номер общежития *</label>
                    <input type="number" id="dorm" required min="1" placeholder="Например: 4">
                </div>
                <div class="form-group">
                    <label for="room">Блок *</label>
                    <input type="number" id="room" required min="1" placeholder="Например: 813">
                </div>
            </div>

            <div class="form-group">
                <label for="date">Срок заселения *</label>
                <input type="date" id="date" required>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="foreigner">
                <label for="foreigner">Является иностранцем</label>
            </div>

            <div class="form-group">
                <label for="notes">Заметки</label>
                <textarea id="notes" rows="4" placeholder="Например: Я, Абдулин Карим Ринатович, прошу убрать меня из приказа на отчисление..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary" id="submit-btn">Сохранить данные</button>
        </form>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
